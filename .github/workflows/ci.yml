name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run lint
      - name: Forbid next/font/google
        # Fonts are vendored in app/fonts and loaded via next/font/local;
        # next/font/google makes `next build` depend on fonts.googleapis.com
        # being reachable and well-formed.
        run: |
          # Scan from the repo root so a renamed or removed directory cannot
          # turn a match into grep's "operand missing" status 2, which `if`
          # would read as "no match". Only rc 1 (no match) passes.
          rc=0
          grep -rn \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --include='*.mjs' --include='*.cjs' --include='*.mts' --include='*.cts' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage --exclude-dir=.git \
            'next/font/google' . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "next/font/google is forbidden, vendor the font and use next/font/local" >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "font guard could not scan (grep exit $rc)" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm run test:coverage

  docker-build:
    # Smoke test only: the image must keep building from the lockfile
    # (`npm ci`) with the same flags as the build job. No push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t project-forge:ci .
