name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run lint
      - name: Forbid next/font/google
        # Fonts are vendored in app/fonts and loaded via next/font/local;
        # next/font/google makes `next build` depend on fonts.googleapis.com
        # being reachable and well-formed.
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.next 'next/font/google' app components lib middleware.ts; then
            echo "next/font/google is forbidden, vendor the font and use next/font/local" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm run test:coverage
