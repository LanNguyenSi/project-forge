name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run build
        env:
          GITHUB_TOKEN: "mock"
          GITHUB_OWNER: "mock"
          PLANFORGE_PATH: "/tmp"
          SCAFFOLDKIT_PYTHON: "python3"
      - run: npx vitest run
