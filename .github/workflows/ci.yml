name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit --skipLibCheck
      - name: Migrations match schema.prisma
        # Applies prisma/migrations to a fresh SQLite file and diffs the result
        # against the schema: a schema change without a migration fails here.
        run: sh scripts/check-migrations.sh
      - run: npm run lint
      - name: Forbid next/font/google
        # Fonts are vendored in app/fonts and loaded via next/font/local;
        # next/font/google makes `next build` depend on fonts.googleapis.com
        # being reachable and well-formed.
        run: |
          # Scan from the repo root so a renamed or removed directory cannot
          # turn a match into grep's "operand missing" status 2, which `if`
          # would read as "no match". Only rc 1 (no match) passes.
          rc=0
          grep -rn \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --include='*.mjs' --include='*.cjs' --include='*.mts' --include='*.cts' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage --exclude-dir=.git \
            'next/font/google' . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "next/font/google is forbidden, vendor the font and use next/font/local" >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "font guard could not scan (grep exit $rc)" >&2
            exit 1
          fi
      - run: npm run build
      - name: sqlite3 present (scripts/start.sh tests use the real binary)
        run: sqlite3 --version
      - run: npm run test:coverage

  docker-build:
    # Smoke test only: the image must keep building from the lockfile
    # (`npm ci`), with the same flags as the build job, and the built image must
    # start and answer /api/health. No push.
    runs-on: ubuntu-latest
    # The image build (two `npm ci` stages and `next build`) takes a few
    # minutes and the smoke step is bounded at about 90 s; 15 minutes leaves
    # headroom for a cold runner and stops a hung docker call from holding the
    # runner for the 6 h default.
    timeout-minutes: 15
    env:
      IMAGE: project-forge:ci
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t "$IMAGE" .
      - name: Image carries the start script, the migrations and sqlite3
        # The container CMD runs scripts/start.sh, which needs all three.
        run: >-
          docker run --rm --entrypoint sh "$IMAGE" -c
          'sqlite3 --version && test -f scripts/start.sh && test -f prisma/migrations/migration_lock.toml && node_modules/.bin/prisma --version'
      - name: Image starts and answers /api/health
        # Runs the image the way production does (the container CMD, so
        # scripts/start.sh migrates a fresh SQLite file on a tmpfs first, then
        # `next start`), with the production hardening flags of
        # docker-compose.yml. The values are dummies generated here, none is a
        # real secret; they satisfy the production start-up checks of
        # lib/startup-checks.ts (NEXTAUTH_SECRET not a placeholder, NEXTAUTH_URL
        # not the example host). /api/health answers 500 when that check fails,
        # and the container exits when start.sh refuses to start, so both fail
        # this step.
        run: |
          set -eu
          cid=""
          body=$(mktemp)
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null || true; fi
            rm -f "$body"
          }
          trap cleanup EXIT
          cid=$(docker run -d \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /data \
            -e NEXTAUTH_SECRET="$(openssl rand -hex 32)" \
            -e NEXTAUTH_URL=https://forge.ci.invalid \
            -e DATABASE_URL=file:/data/project-forge.db \
            -p 127.0.0.1::3000 \
            "$IMAGE")
          port=$(docker port "$cid" 3000/tcp | head -n 1 | sed 's/.*://')
          code=000
          # 000 means nothing listens yet (migrations still running): keep
          # polling until a 90 s deadline (a probe in flight finishes first,
          # curl allows 2 s) and only while the container is up. Any HTTP
          # status is final.
          start=$SECONDS
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -s -o "$body" -w '%{http_code}' --max-time 2 "http://127.0.0.1:$port/api/health" || true)
            [ "$code" != 000 ] && break
            [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = true ] || break
            sleep 1
          done
          if [ "$code" != 200 ] || [ "$(cat "$body")" != '{"ok":true}' ]; then
            echo "health smoke failed: status $code, body: $(cat "$body")" >&2
            docker logs "$cid" >&2 || true
            exit 1
          fi
          echo "health smoke ok after $((SECONDS - start))s: $(cat "$body")"
