# Pinned compose project name. Named volumes are prefixed with it
# (project-forge_forge_db), so without a pin the volume follows the name of the
# checkout directory and a moved or re-cloned checkout starts on an empty one.
# A -p flag or COMPOSE_PROJECT_NAME still wins over this key.
name: project-forge

# Bounded container logs: json-file keeps at most 3 x 10 MB per service, so a
# chatty or crash-looping container cannot fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    # Privilege hardening. The app still runs as root (the production forge_db
    # volume is root-owned, so a non-root USER is a separate migration), but it
    # needs none of the privileges root is granted by default.
    #   no-new-privileges: block setuid/setgid and file-capability escalation
    #     for every process the container starts.
    #   cap_drop: ALL: remove every capability, none added back. The app writes
    #     only into the root-owned forge_db and forge_tmp volumes and the
    #     root-owned image tree (no DAC_OVERRIDE); it never chowns, and it only
    #     changes or writes files it created itself (no CHOWN / FOWNER; a host
    #     file copied in with `docker compose cp` keeps the host uid and is
    #     unreadable to root here, see docs/deployment.md "Restoring a
    #     backup"). Scaffold extraction works because planforge packs
    #     root-owned entries from writable directories and tar runs with
    #     --no-same-owner; watch for the signatures 'Cannot change ownership'
    #     and 'Cannot open: Permission denied' if planforge changes. It listens on 3000, above
    #     the privileged-port floor (no NET_BIND_SERVICE).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      FORGE_TEMP_DIR: /tmp/project-forge
      # SQLite lives on the forge_db volume (mounted at /data below), so a
      # rebuild or recreate keeps the data. FORGE_DATABASE_URL is a
      # compose-only knob read from .env or the shell; the DATABASE_URL in .env
      # is for local development and does not reach the container. Deploy
      # tooling runs `docker compose -f docker-compose.yml`, which skips
      # docker-compose.override.yml, so a path that must survive such deploys
      # belongs in FORGE_DATABASE_URL, not in the override.
      DATABASE_URL: ${FORGE_DATABASE_URL:-file:/data/project-forge.db}
      # Planforge HTTP boundary (ADR-0002). The planforge service runs both
      # the planforge CLI and scaffoldkit in-container; this app just POSTs
      # input and untars the response. No bind-mounts needed.
      PLANFORGE_URL: http://planforge:8223
      # Required: compose refuses to start the stack when it is unset or empty.
      # Read from .env or the shell: compose interpolates this file before it
      # merges the override, so a value that only the override sets does not
      # satisfy the check.
      PLANFORGE_SERVICE_TOKEN: ${PLANFORGE_SERVICE_TOKEN:?set PLANFORGE_SERVICE_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      - forge_tmp:/tmp/project-forge
      - forge_db:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.project-forge.rule: Host(`project-forge.opentriologue.ai`)
      traefik.http.routers.project-forge.entrypoints: websecure
      traefik.http.routers.project-forge.tls.certresolver: letsencrypt
      traefik.http.services.project-forge.loadbalancer.server.port: "3000"
    depends_on:
      planforge:
        # Wait until planforge reports healthy so project-forge boots with a
        # live PLANFORGE_URL target. Without the condition, app would race
        # the first request and 502 until the Hono server finishes booting.
        condition: service_healthy
    healthcheck:
      # Inline Node so the probe needs no curl/wget in the image. /api/health
      # is public and does no database work. The start period covers what
      # scripts/start.sh does before `next start`: `prisma migrate deploy` and,
      # when a migration is pending or a legacy database is baselined, the
      # pre-migrate copy of the SQLite file (measured start: about one second
      # with a small database; the copy takes longer on a large one).
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
      # During the start period, probe every 2 s instead of every `interval`,
      # so the container turns healthy (and Traefik routes to it) within
      # seconds of the server listening. Needs Docker Engine 25 or newer.
      start_interval: 2s
    logging: *default-logging
    networks:
      - traefik
    restart: unless-stopped

  # ── agent-planforge HTTP service (ADR-0002) ───────────────────────────
  #
  # Built from a pinned revision of the public agent-planforge repo: the build
  # context is a git URL with an explicit ref (a release tag or a full commit
  # SHA), fetched by the Docker daemon at build time. No sibling checkout is
  # needed, so a clean clone builds and a rollback rebuilds the same toolchain.
  # The ref is the ONLY place the planforge version is set: to update
  # planforge, change the commit SHA after `#` below (see docs/deployment.md). For local
  # development against an agent-planforge checkout, set PLANFORGE_CONTEXT
  # (for example PLANFORGE_CONTEXT=../agent-planforge in .env); it is never the
  # default. The image ships the planforge CLI, the TypeScript HTTP layer, AND
  # a pinned scaffoldkit venv that runs scaffoldkit server-side, see
  # `server/Dockerfile` in that repo.
  #
  # Intentionally NOT Traefik-exposed. Access is scoped to the shared
  # `traefik` docker network, where project-forge reaches it via the
  # internal DNS name `planforge:8223`. The service-token gate enforces
  # auth on /api/*.
  planforge:
    build:
      context: ${PLANFORGE_CONTEXT:-https://github.com/LanNguyenSi/agent-planforge.git#88a5453a49bba5fd63588c5015bb754645d3f74e}
      dockerfile: server/Dockerfile
    environment:
      PLANFORGE_SERVICE_TOKEN: ${PLANFORGE_SERVICE_TOKEN:?set PLANFORGE_SERVICE_TOKEN in .env (openssl rand -hex 32)}
    # No ports: — traffic stays on the internal docker network. No Traefik
    # labels either: public exposure would bypass the service-token contract.
    healthcheck:
      # Inline Node so we don't have to add curl/wget to the image. /healthz
      # is unauth (by design), so the probe doesn't need the service token.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8223/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - traefik
    restart: unless-stopped

volumes:
  forge_tmp:
  forge_db:

networks:
  traefik:
    external: true
